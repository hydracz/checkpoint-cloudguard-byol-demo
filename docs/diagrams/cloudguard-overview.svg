<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Check Point CloudGuard BYOL：当前默认架构总览</title>
  <desc id="diagram-description">West Europe 的 Hub 和主 Spoke、North Europe 的远端 Spoke；同一 CloudGuard VM 有三块网卡。业务经 eth2 检查，互联网出站经 eth1；Bastion 经 Windows 管理 eth0，也可经 Peering 直接 SSH 到主 workload。主表 12 条 UDR 精确排除 Bastion /26，远端表仍 3 条。日志经 collector、AMA、DCR、Log Analytics，再可选导出到 GRS Storage。不是实时部署状态。</desc>
