<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>$pagetitle$</title>
  <style>
$if(highlighting-css)$
$highlighting-css$
$endif$
    :root { --ink: #172033; --muted: #5f6b7a; --blue: #1768ac; --line: #d9e0e8; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-padding-top: 24px; }
    body {
      margin: 0; color: var(--ink); background: #f5f7fa; overflow-wrap: anywhere;
      font: 16px/1.8 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 28px; max-width: 1680px; margin: 0 auto; padding: 28px; align-items: start; }
    aside { position: sticky; top: 24px; padding: 22px; background: #fff; border: 1px solid var(--line); border-radius: 12px; font-size: 13px; line-height: 1.6; }
    .brand { color: var(--blue); font-size: 12px; font-weight: 700; letter-spacing: .1em; }
    summary { margin: 12px 0; cursor: pointer; font-size: 18px; font-weight: 700; }
    nav { max-height: calc(100vh - 310px); overflow-y: auto; padding-right: 8px; }
    nav ul { margin: 0; padding-left: 15px; list-style: none; }
    nav > ul, nav > ul > li > ul { padding-left: 0; }
    nav > ul > li > a { display: none; }
    nav li { margin: 7px 0; }
    nav a { display: block; color: var(--muted); text-decoration: none; }
    nav a:hover { color: var(--blue); }
    .offline-note { color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; margin-bottom: 0; }
    main { min-width: 0; padding: 40px 46px 52px; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
    .export-meta { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
    h1 { margin: 0 0 24px; font-size: clamp(26px, 2.7vw, 38px); line-height: 1.35; letter-spacing: -.02em; }
    h2 { margin: 44px 0 20px; padding-bottom: 10px; border-bottom: 2px solid var(--line); color: #153b61; font-size: 25px; line-height: 1.5; }
    h3 { margin: 30px 0 14px; padding-left: 12px; border-left: 4px solid var(--blue); font-size: 20px; line-height: 1.5; }
    p { margin: 14px 0; }
    a { color: var(--blue); text-underline-offset: 3px; }
    a:focus-visible, summary:focus-visible { outline: 3px solid #f59e0b; outline-offset: 4px; }
    a[download] { font-weight: 600; white-space: nowrap; }
    strong { font-weight: 700; }
    li { margin: 7px 0; }
    li > p { margin: 8px 0; }
    ol, ul { padding-left: 1.6em; }
    img.architecture-diagram { display: block; width: 100%; height: auto; margin: 24px 0; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    table { width: 100%; margin: 22px 0; border-collapse: collapse; font-size: 14px; line-height: 1.7; }
    th, td { padding: 11px 13px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: #153b61; background: #eaf3fb; font-weight: 650; }
    tbody tr:nth-child(even) { background: #f8fafc; }
    code, pre { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    :not(pre) > code { padding: 2px 5px; border-radius: 4px; background: #eef2f7; font-size: .9em; overflow-wrap: anywhere; }
    div.sourceCode { margin: 18px 0; padding: 0; background: transparent; }
    pre, pre.sourceCode { margin: 18px 0; padding: 18px 20px; overflow-x: auto; border: 1px solid var(--line); border-left: 4px solid var(--blue); border-radius: 8px; background: #f6f8fb; font-size: 13px; line-height: 1.7; white-space: pre; overflow-wrap: normal; }
    pre > code { padding: 0; background: transparent; font-size: inherit; }
    pre code.sourceCode { white-space: pre; }
    blockquote { margin: 20px 0; padding: 8px 20px; border-left: 4px solid #d97706; background: #fff8eb; }
    footer { margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
    .skip-link { position: absolute; top: -80px; left: 24px; padding: 8px 16px; background: white; z-index: 2; }
    .skip-link:focus { top: 8px; }
    @media (max-width: 1100px) {
      .layout { grid-template-columns: 220px minmax(0, 1fr); gap: 16px; padding: 16px; }
      aside { padding: 16px; }
      main { padding: 28px; }
    }
    @media (max-width: 780px) {
      .layout { display: block; padding: 10px; }
      aside { position: static; margin-bottom: 16px; }
      nav { max-height: 300px; }
      main { padding: 22px 16px; }
      table { display: block; overflow-x: auto; }
      th, td { min-width: 100px; }
    }
    @media print {
      @page { size: A4 landscape; margin: 14mm; }
      body { background: #fff; font-size: 10pt; }
      .layout { display: block; max-width: none; padding: 0; }
      aside, .skip-link { display: none; }
      main { padding: 0; border: 0; }
      h2, h3 { break-after: avoid; }
      tr, img, pre { break-inside: avoid; }
      pre, pre code.sourceCode { white-space: pre-wrap; overflow-wrap: anywhere; }
      table { display: table; font-size: 9pt; }
      thead { display: table-header-group; }
      a { color: inherit; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#content">跳到正文</a>
  <div class="layout">
    <aside aria-label="文档导航">
      <div class="brand">CLOUDGUARD BYOL DEMO</div>
      <details open>
        <summary>目录</summary>
        <nav aria-label="目录">$table-of-contents$</nav>
      </details>
      <p class="offline-note">单文件离线版：图片和图源已内嵌。点击 SVG / Excalidraw / draw.io 链接可下载；其他参考文档链接需要联网。</p>
    </aside>
    <main id="content">
      <p class="export-meta">依据仓库当前默认配置生成 · 非实时 Azure 环境快照 · 含主 Spoke Bastion 回程修正</p>
$body$
      <footer>源文件：docs/architecture-and-walkthrough.md。基础设施部署、手工安全配置、路由与登录认证应分别核验；勿提交客户凭据和部署 state。</footer>
    </main>
  </div>
</body>
</html>
