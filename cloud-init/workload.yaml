#cloud-config
write_files:
  - path: /var/www/html/index.html
    permissions: "0644"
    content: |
      ${site_name}
      Check Point CloudGuard BYOL east-west demo target
  - path: /etc/systemd/system/demo-web.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Demo HTTP service
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStart=/usr/bin/python3 -m http.server 8080 --directory /var/www/html
      Restart=always
      User=nobody
      Group=nogroup

      [Install]
      WantedBy=multi-user.target
runcmd:
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, demo-web.service]
